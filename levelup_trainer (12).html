<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Level Up"><meta name="theme-color" content="#0e1220">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<title>Level Up Trainer</title>
<style>
:root{--bg:#0e1220;--card:#181e33;--acc:#ff4d6d;--acc2:#3ddc97;--tx:#e8ecff;--mut:#8a93b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:16px}
h1{margin:0 0 12px;font-size:22px}h1 span{color:var(--acc)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border-radius:12px;padding:14px}h2{margin:0 0 10px;font-size:16px;color:var(--mut)}
input,button{font:inherit;border-radius:8px;border:1px solid #333a5c;background:#0f1428;color:var(--tx);padding:8px}
html{-webkit-text-size-adjust:100%}body{padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));-webkit-tap-highlight-color:transparent}
input,button{font-size:16px;min-height:44px;touch-action:manipulation}.chip b{padding:4px 8px;font-size:18px}
button{background:var(--acc);border:0;cursor:pointer;font-weight:600;-webkit-user-select:none;user-select:none}button:active{filter:brightness(1.25)}button.alt{background:#333a5c}button.go{background:var(--acc2);color:#062}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row input{flex:1;min-width:0}
.chip{display:inline-flex;gap:6px;align-items:center;background:#262e4d;padding:4px 10px;border-radius:99px;margin:3px}
.chip b{cursor:pointer;color:var(--acc)}
.match{font-size:20px;font-weight:700;text-align:center;padding:10px;background:#0f1428;border-radius:10px;margin-bottom:8px}
.timer{font-size:42px;text-align:center;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid #262e4d}
/* ---- UI upgrade ---- */
:root{--bg:#070a14;--card:rgba(24,30,56,.72);--line:rgba(255,255,255,.08);--acc:#ff3d6e;--acc2:#2ee6a0;--gold:#ffc94d;--tx:#eef1ff;--mut:#8f98c4}
body{font-family:Inter,system-ui,sans-serif;min-height:100vh;background:radial-gradient(1200px 600px at 10% -10%,rgba(255,61,110,.18),transparent 60%),radial-gradient(900px 600px at 110% 10%,rgba(46,230,160,.14),transparent 60%),var(--bg);background-attachment:fixed}
h1{font-family:Orbitron,Inter,sans-serif;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:.4em}
h1::before{content:"";width:.7em;height:.7em;border-radius:3px;background:linear-gradient(135deg,var(--acc),var(--gold));box-shadow:0 0 14px var(--acc)}
h1 span{background:linear-gradient(90deg,var(--acc),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
h2{text-transform:uppercase;letter-spacing:.12em;font-weight:700;font-size:13px}
#mc{border-color:rgba(255,61,110,.35);box-shadow:0 10px 40px rgba(255,61,110,.15),inset 0 1px 0 rgba(255,255,255,.06)}
input{background:rgba(0,0,0,.35);border:1px solid var(--line);transition:border-color .15s,box-shadow .15s}
input:focus{outline:none;border-color:var(--acc2);box-shadow:0 0 0 3px rgba(46,230,160,.2)}
button{background:linear-gradient(180deg,#ff5a84,var(--acc));box-shadow:0 4px 14px rgba(255,61,110,.3);transition:transform .08s,filter .15s;letter-spacing:.02em}
button:hover{filter:brightness(1.1)}button:active{transform:scale(.96)}
button.alt{background:rgba(255,255,255,.07);border:1px solid var(--line);box-shadow:none}
button.go{background:linear-gradient(180deg,#5cf2b8,var(--acc2));color:#032;box-shadow:0 4px 14px rgba(46,230,160,.3)}
.chip{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.match{font-family:Orbitron,Inter,sans-serif;background:linear-gradient(135deg,rgba(255,61,110,.15),rgba(255,201,77,.08));border:1px solid var(--line)}
.timer{font-family:Orbitron,monospace;font-weight:800;text-shadow:0 0 24px rgba(46,230,160,.35);margin:6px 0}
.cz{background:rgba(0,0,0,.3);border:1px solid var(--line)}.cz .n{font-family:Orbitron,Inter,sans-serif;color:var(--gold)}
.ctot{font-family:Orbitron,Inter,sans-serif;color:var(--acc2)}
table{font-variant-numeric:tabular-nums}th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
td,th{border-bottom:1px solid var(--line)}tbody tr:hover,#hist tr:hover{background:rgba(255,255,255,.03)}
#lb tr:nth-child(2) td{color:var(--gold);font-weight:700}#lb tr:nth-child(2) td:first-child::before{content:"🥇 "}
#lb tr:nth-child(3) td{color:#d5dbef;font-weight:600}#lb tr:nth-child(3) td:first-child::before{content:"🥈 "}
#lb tr:nth-child(4) td{color:#e0a46c;font-weight:600}#lb tr:nth-child(4) td:first-child::before{content:"🥉 "}
tr:first-child td{color:inherit}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
body.big{padding:max(1.5vh,env(safe-area-inset-top)) max(1.5vw,env(safe-area-inset-right)) max(1.5vh,env(safe-area-inset-bottom)) max(1.5vw,env(safe-area-inset-left));height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;font-size:2.6vh}
body.big h1{font-size:4.5vh;margin-bottom:1.5vh}
body.big .grid{flex:1;min-height:0;grid-template-columns:1fr 1.3fr 1fr;grid-template-rows:1fr 1fr;gap:1.5vh}
body.big .card{padding:2vh;border-radius:1.5vh;overflow:auto;min-height:0}
body.big #mc{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;justify-content:center}
body.big .card:nth-child(1){grid-column:1;grid-row:1}body.big .card:nth-child(4){grid-column:1;grid-row:2}
body.big .card:nth-child(3){grid-column:3;grid-row:1/3}
body.big h2{font-size:3vh;margin-bottom:1.5vh}
body.big input,body.big button{font-size:2.6vh;padding:1.2vh 1.6vh;border-radius:1vh}
body.big .row{gap:1vh;margin-bottom:1.2vh}body.big .chip{font-size:2.6vh;padding:.6vh 1.4vh}
body.big .match{font-size:5vh;padding:2vh}
body.big .timer{font-size:22vh;line-height:1.1;font-weight:800}
body.big .mut{font-size:2.2vh}body.big td,body.big th{padding:1vh}
tr:first-child td{color:gold}.mut{color:var(--mut);font-size:13px}
@media (max-width:820px){body.big{overflow:auto;height:auto}body.big .grid{grid-template-columns:1fr;grid-template-rows:none}body.big .card{grid-column:auto!important;grid-row:auto!important}body.big #mc{order:-1}body.big .timer{font-size:18vh}}
.calc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.cz{background:#0f1428;border-radius:10px;padding:6px;text-align:center}.cz .l{font-size:12px;color:var(--mut)}.cz .n{font-size:22px;font-weight:700}
.cz .b{display:flex;gap:4px}.cz button{flex:1;padding:4px;min-height:40px}.ctot{text-align:center;font-weight:700;margin-bottom:8px}
body.big .calc{gap:1vh}body.big .cz .l{font-size:2vh}body.big .cz .n{font-size:4vh}body.big .cz button{min-height:5vh;font-size:3vh}
/* fit fixes */
.calc{grid-template-columns:repeat(5,minmax(0,1fr))}.cz{min-width:0}.cz .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cz button{min-width:0;padding:4px 0}.cz .b{gap:3px}
#lb td:first-child,#lb th:first-child{white-space:nowrap}
body.big #mc{justify-content:safe center;overflow-x:hidden;gap:1.2vh}body.big #mc>*{flex-shrink:0}
body.big #mc h2{margin:0}body.big .match{font-size:4.2vh;padding:1.4vh;margin:0}
body.big .timer{font-size:min(17vh,10vw);margin:0}
body.big .cz{padding:.8vh .5vw}body.big .cz .l{font-size:1.8vh}body.big .cz .n{font-size:3.4vh}body.big .cz button{font-size:2.6vh}
body.big #mc .row{margin:0}body.big .ctot{margin:0}
</style></head><body>
<h1>VEX IQ <span>Level Up</span> Trainer</h1>
<div class="grid">
 <div class="card"><h2>Drivers</h2>
  <div class="row"><input id="nm" placeholder="Driver name"><button onclick="addP()">Add</button></div>
  <div id="plist"></div></div>
 <div class="card" id="mc"><h2>Next Match</h2>
  <div id="cur" class="match">Add 2+ drivers</div>
  <div class="timer" id="tm">1:00</div>
  <div class="row"><button class="go" onclick="startT()">Start</button><button class="alt" onclick="resetT()">Reset</button><button class="alt" onclick="skip()">Skip</button><button class="alt" onclick="big()">⛶ Full Screen</button></div>
  <div id="calc"></div>
  <div class="row"><input id="sc" type="number" inputmode="decimal" enterkeyhint="done" placeholder="Match score"><button class="alt" id="dqb" onclick="DQ=!DQ;dqR()">DQ: Off</button><button onclick="save()">Save</button></div>
  <div class="mut">Drivers 1 &amp; 2 share the robot (swap at 25s left). Rotation picks who's played least, avoiding repeat pairs.</div></div>
 <div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 id="lbh" style="margin:0">Leaderboard</h2><button class="alt" onclick="S.mode=S.mode==='raw'?'real':'raw';render()" id="mb">Mode</button></div><table id="lb"></table></div>
 <div class="card"><h2>Match History</h2><div class="row"><button class="alt" onclick="undo()">Undo last</button><button class="alt" onclick="wipe()">Clear all</button></div><table id="hist"></table></div>
</div>
<script>
let S={players:[],matches:[],cur:null};
try{const d=JSON.parse(localStorage.getItem('lvlup'));if(d)S=d}catch(e){}
const store=()=>{try{localStorage.setItem('lvlup',JSON.stringify(S))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stats(n){const s=S.matches.filter(m=>m.p.includes(n)).map(m=>S.mode==="raw"||!m.dq?m.s:0);return{dq:S.matches.filter(m=>m.dq&&m.p.includes(n)).length,c:s.length,avg:s.length?s.reduce((a,b)=>a+b,0)/s.length:0,best:s.length?Math.max(...s):0}}
function pairCount(a,b){return S.matches.filter(m=>m.p.includes(a)&&m.p.includes(b)).length}
function next(){const P=S.players;if(P.length<2){S.cur=null;return}
 let best=null,bs=1e9;
 for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
  const sc=(stats(P[i]).c+stats(P[j]).c)*10+pairCount(P[i],P[j])*3+Math.random();
  if(sc<bs){bs=sc;best=[P[i],P[j]]}}
 S.cur=Math.random()<.5?best:best.reverse()}
function addP(){const i=document.getElementById('nm'),n=i.value.trim();if(n&&!S.players.includes(n)){S.players.push(n);if(!S.cur)next()}i.value='';render()}
function rmP(n){S.players=S.players.filter(x=>x!==n);if(S.cur&&S.cur.includes(n))next();render()}
const ZONES=[['Floor',1],['Level 1',3],['Level 2',6],['Level 3',12],['Level 4',16]];let CZ=[0,0,0,0,0];
function calcR(){const tot=CZ.reduce((t,c,i)=>t+c*ZONES[i][1],0);
 document.getElementById('calc').innerHTML='<div class="calc">'+ZONES.map((z,i)=>`<div class="cz"><div class="l">${z[0]}</div><div class="n">${CZ[i]}</div><div class="b"><button class="alt" onclick="cz(${i},-1)">−</button><button onclick="cz(${i},1)">+</button></div></div>`).join('')+`</div><div class="ctot">Total: ${tot} <button class="alt" onclick="CZ=[0,0,0,0,0];calcR()">Clear</button></div>`;
 document.getElementById('sc').value=tot||''}
function cz(i,d){CZ[i]=Math.max(0,CZ[i]+d);calcR()}
function save(){const v=parseFloat(document.getElementById('sc').value);if(!S.cur||isNaN(v))return;
 S.matches.push({p:S.cur,s:v,dq:DQ});DQ=false;dqR();CZ=[0,0,0,0,0];calcR();next();resetT();render()}
function skip(){next();render()}
function undo(){S.matches.pop();render()}
function wipe(){if(confirm('Clear all drivers and matches?')){S={players:[],matches:[],cur:null};render()}}
let t=60,iv=null;
function draw(){document.getElementById('tm').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');document.getElementById('tm').style.color=t<=25&&t>0?'#ffcc4d':''}
let AC=null,cd=null;
let OUT=null;
function bus(){if(OUT||!AC)return OUT;const c=AC.createDynamicsCompressor();c.threshold.value=-18;c.knee.value=6;c.ratio.value=8;c.attack.value=.002;c.release.value=.15;
 const g=AC.createGain();g.gain.value=2.2;g.connect(c).connect(AC.destination);return OUT=g}
function tone(f,d,type='sine',v=.4){if(!AC)return;const o=bus(),n=AC.currentTime;
 [[1,1],[2,.35],[3,.15]].forEach(([m,a])=>{const os=AC.createOscillator(),g=AC.createGain();os.type=m===1?type:'sine';os.frequency.value=f*m;
  g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v*a,n+.008);g.gain.setValueAtTime(v*a,n+Math.min(d*.6,.25));g.gain.exponentialRampToValueAtTime(.0001,n+d);
  os.connect(g).connect(o);os.start(n);os.stop(n+d+.05)})}
function bellHit(f){if(!AC)return;const o=bus(),n=AC.currentTime;
 [[1,.6,1.8],[2.76,.3,1.2],[5.4,.15,.7],[8.9,.08,.4]].forEach(([m,a,d])=>{const os=AC.createOscillator(),g=AC.createGain();os.frequency.value=f*m;
  g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(a,n+.004);g.gain.exponentialRampToValueAtTime(.0001,n+d);os.connect(g).connect(o);os.start(n);os.stop(n+d+.05)})}
function bell(){bellHit(880);setTimeout(()=>bellHit(880),400);setTimeout(()=>bellHit(880),800)}
function startT(){if(iv||cd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
 if(t<60){run();return}
 let c=3;const tm=document.getElementById('tm');tm.textContent=c;tone(784,.35,'square',.5);
 cd=setInterval(()=>{c--;if(c>0){tm.textContent=c;tone(784,.35,'square',.5)}else{clearInterval(cd);cd=null;tone(1175,.9,'square',.6);draw();run()}},1000)}
function run(){iv=setInterval(()=>{t--;draw();if(t===35||t===25)bell();if(t<=0){clearInterval(iv);iv=null;tone(330,1.5,'sawtooth',.6)}},1000)}
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function big(){const b=document.body,d=document.documentElement;if(b.classList.contains('big')){b.classList.remove('big');try{if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document)?.catch?.(()=>{})}catch(e){}}else{b.classList.add('big');try{(d.requestFullscreen||d.webkitRequestFullscreen)?.call(d)?.catch?.(()=>{})}catch(e){}}}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!fsEl())document.body.classList.remove('big')}));
document.getElementById('sc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.target.blur();save()}});
function resetT(){clearInterval(iv);clearInterval(cd);iv=cd=null;t=60;draw()}
let DQ=false;function dqR(){const b=document.getElementById('dqb');b.textContent='DQ: '+(DQ?'ON':'Off');b.style.background=DQ?'var(--acc)':''}
function render(){store();const raw=S.mode==='raw';document.getElementById('lbh').textContent=raw?'Leaderboard — Non-DQ score':'Leaderboard — Real score';document.getElementById('mb').textContent=raw?'Show Real score':'Show Non-DQ score';
 document.getElementById('plist').innerHTML=S.players.map(n=>`<span class="chip">${esc(n)}<b onclick='rmP(${JSON.stringify(n).replace(/'/g,"&#39;")})'>×</b></span>`).join('')||'<span class="mut">No drivers yet</span>';
 document.getElementById('cur').innerHTML=S.cur?`Match ${S.matches.length+1}<br>${esc(S.cur[0])} → ${esc(S.cur[1])}`:'Add 2+ drivers';
 const r=S.players.map(n=>({n,...stats(n)})).sort((a,b)=>b.avg-a.avg);
 document.getElementById('lb').innerHTML='<tr><th>#</th><th>Driver</th><th>Avg</th><th>Best</th><th>Played</th><th>DQs</th></tr>'+r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td>${x.avg.toFixed(1)}</td><td>${x.best}</td><td>${x.c}</td><td style="color:${x.dq?'var(--acc)':''}">${x.dq}</td></tr>`).join('');
 document.getElementById('lb').querySelector('tr').style.color='';
 document.getElementById('hist').innerHTML=S.matches.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.p[0])} + ${esc(m.p[1])}</td><td>${m.s}${m.dq?' <span style="color:var(--acc);font-weight:700">DQ</span>':''}</td></tr>`).reverse().join('');}
document.getElementById('nm').addEventListener('keydown',e=>{if(e.key==='Enter')addP()});
if(!S.cur)next();render();draw();calcR();
</script></body></html>
